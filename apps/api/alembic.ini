# Alembic configuration for APTLY API
# Generated for SQLAlchemy 2.x async support

[alembic]
script_location = alembic
prepend_sys_path = .

# Path to version files
version_locations = %(here)s/alembic/versions
path_separator = os

# Template for new migration filenames
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Truncate long revision names
truncate_slug_length = 40

# Timezone for revision timestamps
timezone = UTC

# Use sqlalchemy.url from env.py — DATABASE_URL is set there from config
sqlalchemy.url =

[post_write_hooks]
# Run ruff format on generated migration files
hooks = ruff_format
ruff_format.type = exec
ruff_format.executable = %(here)s/.venv/Scripts/ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
