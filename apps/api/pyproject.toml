[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project]
name = "aptly-api"
version = "0.1.0"
description = "APTLY — Evidence-Grounded Multimodal AI Interview Coach — Backend API"
requires-python = ">=3.11"

dependencies = [
    # ── Web Framework ──────────────────────────────────────────
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",

    # ── Configuration & Validation ─────────────────────────────
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",

    # ── Database ───────────────────────────────────────────────
    "sqlalchemy>=2.0.36",
    "alembic>=1.13.0",
    "asyncpg>=0.30.0",           # Async PostgreSQL driver
    "greenlet>=3.1.0",           # Required by SQLAlchemy async

    # ── Cache / Queue ──────────────────────────────────────────
    "redis>=5.1.0",

    # ── Logging ────────────────────────────────────────────────
    "structlog>=24.4.0",

    # ── Utilities ─────────────────────────────────────────────
    "python-ulid>=2.2.0",        # Better than UUID for sortable IDs
    "python-jose[cryptography]>=3.3.0",  # JWT (future auth)
    "aiofiles>=24.1.0",          # Async file I/O for local storage
    "httpx>=0.27.0",             # Async HTTP client
    "google-genai>=1.0.0",       # Gemini structured generation provider
]

[project.optional-dependencies]
dev = [
    # ── Testing ────────────────────────────────────────────────
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",             # For HTTPX async test client
    "anyio>=4.6.0",
    "aiosqlite>=0.20.0",         # In-memory SQLite for unit tests (no PostgreSQL required)

    # ── Code Quality ───────────────────────────────────────────
    "ruff>=0.7.0",
    "mypy>=1.12.0",
    "types-aiofiles>=24.1.0",
]


# ─── Ruff ────────────────────────────────────────────────────
[tool.ruff]
target-version = "py311"
line-length = 88
exclude = [
    ".venv",
    "alembic/versions",
    "__pycache__",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "ANN", # flake8-annotations
    "S",   # flake8-bandit (security)
    "RUF", # Ruff-specific rules
]
ignore = [
    "ANN401",  # Dynamically typed expressions (Any) — allowed in base classes
    "S101",    # Use of assert — allowed in tests
    "S104",    # Binding to all interfaces — needed in dev
    "N818",    # Exception naming convention (AptlyException is standard)
    "E501",    # Line length (handled by formatter)
    "B008",    # Do not perform function call `Depends` in argument defaults (FastAPI dependency injection pattern)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "S"]  # Relax annotations and security rules in tests

[tool.ruff.lint.isort]
known-first-party = ["app"]

# ─── MyPy ────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
strict = true
exclude = ["alembic/", "tests/"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["structlog.*", "ulid.*", "jose.*"]
ignore_missing_imports = true

# ─── Pytest ──────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = [
    "--strict-markers",
    "--tb=short",
    "-v",
]
markers = [
    "integration: marks tests as integration tests (require DB/Redis)",
    "unit: marks tests as unit tests (no external dependencies)",
    "e2e: marks tests as end-to-end tests",
]

# ─── Coverage ────────────────────────────────────────────────
[tool.coverage.run]
source = ["app"]
omit = ["tests/*", "alembic/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
